name: CI

on:
  push:
    branches: [main, dev]
    # release tags, with or without the v prefix: v1.2.3 / 1.2.3
    tags: ["v*.*.*", "[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main, dev]

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: frontpage
          POSTGRES_PASSWORD: frontpage
          POSTGRES_DB: frontpage
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix client
          npm install --prefix server

      - name: Check types - Client
        run: npm run check-types --prefix client

      - name: Lint - Client
        run: npm run lint --prefix client

      - name: Check types - Server
        run: npm run check-types --prefix server

      - name: Migrations - apply and roll back
        env:
          FRONTPAGE_DATABASE_URL: postgres://frontpage:frontpage@localhost:5432/frontpage
        run: |
          npm run migrate --prefix server
          npm run migrate:status --prefix server
          npm run rollback --prefix server
          npm run migrate --prefix server

  push_to_registry:
    name: Push Docker image to Docker Hub
    needs: [check-and-test]
    runs-on: ubuntu-latest
    # images come from tags only — a push to a branch just runs the checks
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hiquest/frontpage
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
