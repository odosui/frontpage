services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=frontpage
      - POSTGRES_PASSWORD=frontpage
      - POSTGRES_DB=frontpage
    volumes:
      - frontpage-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontpage -d frontpage"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontpage:
    image: hiquest/frontpage:latest
    ports:
      - "3043:3043"
    volumes:
      # only needed to import dashboards from the old json storage
      - ~/.frontpage:/data/frontpage:ro
    environment:
      - NODE_ENV=production
      - FRONTPAGE_DATABASE_URL=postgres://frontpage:frontpage@db:5432/frontpage
      # signs the session cookies — change it, and keep it
      - FRONTPAGE_SECRET=change-me-to-a-long-random-string
      - FRONTPAGE_MODEL_SMALL=google/gemini-3.1-flash-lite
      - FRONTPAGE_MODEL_BIG=openai/gpt-5.6-sol
      - OPENROUTER_API_KEY=yourkey
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Runs queued jobs (page fetches, LLM analysis). Scale with `--scale worker=N`.
  worker:
    image: hiquest/frontpage:latest
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=production
      - FRONTPAGE_DATABASE_URL=postgres://frontpage:frontpage@db:5432/frontpage
      - FRONTPAGE_MODEL_SMALL=google/gemini-3.1-flash-lite
      - FRONTPAGE_MODEL_BIG=openai/gpt-5.6-sol
      - FRONTPAGE_WORKER_CONCURRENCY=2
      # Must match the API key set on the frontpage service:
      - OPENROUTER_API_KEY=yourkey
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  frontpage-db:
